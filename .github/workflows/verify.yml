name: Verify Duze
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  catalogue:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: duze
          POSTGRES_USER: duze
          POSTGRES_PASSWORD: duze_dev_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U duze"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/duze
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Unit and PostgreSQL integration tests; package API
        run: mvn -B verify
        env:
          DUZE_INTEGRATION_TESTS: 'true'
      - name: Seed development catalogue
        run: psql -h localhost -U duze -d duze -v ON_ERROR_STOP=1 --single-transaction -f seed/exobho/pilot_seed.sql
        env:
          PGPASSWORD: duze_dev_password
      - name: Start API
        run: |
          java -jar services/api/target/duze-api-0.1.0-SNAPSHOT.jar > /tmp/duze-api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/actuator/health; then exit 0; fi
            sleep 2
          done
          cat /tmp/duze-api.log
          exit 1
      - run: npm ci
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm test
        working-directory: apps/web
      - name: Docker configuration
        run: docker compose -f infra/compose/docker-compose.yml config --quiet
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-evidence
          path: |
            apps/web/test-results
            services/api/target/surefire-reports
