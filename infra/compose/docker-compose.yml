# Local development only. Flyway owns schema migrations; sample seed is an explicit one-off job.
name: duze
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: duze
      POSTGRES_USER: duze
      POSTGRES_PASSWORD: duze_dev_password
    ports:
      - "127.0.0.1:${DUZE_DB_PORT:-5432}:5432"
    volumes:
      - duze_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duze -d duze"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/duze
      DATABASE_USER: duze
      DATABASE_PASSWORD: duze_dev_password
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    environment:
      DUZE_API_URL: http://api:8080
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
  seed:
    image: postgres:17-alpine
    profiles: ["seed"]
    environment:
      PGPASSWORD: duze_dev_password
    volumes:
      - ../../seed/exobho/pilot_seed.sql:/seed.sql:ro
    entrypoint: ["psql", "-h", "postgres", "-U", "duze", "-d", "duze", "-v", "ON_ERROR_STOP=1", "--single-transaction", "-f", "/seed.sql"]
    depends_on:
      postgres:
        condition: service_healthy
  redis:
    image: redis:7-alpine
    profiles: ["workers"]
    ports:
      - "127.0.0.1:6379:6379"
volumes:
  duze_postgres:
