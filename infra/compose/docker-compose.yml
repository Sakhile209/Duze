services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: duze
      POSTGRES_USER: duze
      POSTGRES_PASSWORD: duze_dev_password
    ports:
      - "5432:5432"
    volumes:
      - duze_postgres:/var/lib/postgresql/data
      - ../../services/api/src/main/resources/db/migration/V1__initial_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../../seed/exobho/pilot_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  duze_postgres:
